<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gh0stCTFHackSpace Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-400 font-mono p-8 min-h-screen">
    
    <div class="max-w-3xl mx-auto">
        <h1 class="text-5xl mb-4 font-bold tracking-widest animate-pulse">👻 LEADERBOARD</h1>
        <p class="mb-8 text-green-600">Submit a flag via <span class="text-green-300 font-bold">GitHub Issues</span> to hack your way to the top!</p>

        <div class="border border-green-500 rounded-lg overflow-hidden shadow-[0_0_15px_rgba(74,222,128,0.3)]">
            <table class="w-full text-left border-collapse">
                <thead class="bg-green-900 text-black">
                    <tr>
                        <th class="py-3 px-6 font-bold">RANK</th>
                        <th class="py-3 px-6 font-bold">HACKER</th>
                        <th class="py-3 px-6 font-bold text-right">SCORE</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="3" class="text-center py-8 text-green-700 animate-pulse">
                            Initializing connection... awaiting data.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            
            try {
                // Fetch the JSON generated by our GitHub Action
                // Note: cache: 'no-store' prevents browsers from showing stale data
                const response = await fetch('leaderboard/global_leaderboard.json', { cache: 'no-store' });
                
                if (!response.ok) {
                    throw new Error('No leaderboard data found');
                }

                const data = await response.json();
                const players = data.leaderboard;

                // Clear the "initializing" message
                tbody.innerHTML = '';

                if (players.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" class="text-center py-8 text-green-700">No flags captured yet. Awaiting first blood...</td>
                        </tr>`;
                    return;
                }

                // Loop through each player and create a table row
                players.forEach(player => {
                    const row = document.createElement('tr');
                    row.className = "border-b border-green-900 hover:bg-green-900 hover:text-black transition-colors duration-200";
                    
                    row.innerHTML = `
                        <td class="py-4 px-6 font-bold">#${player.rank}</td>
                        <td class="py-4 px-6">${player.username}</td>
                        <td class="py-4 px-6 text-right text-lg font-bold">${player.score}</td>
                    `;
                    
                    tbody.appendChild(row);
                });

            } catch (error) {
                console.error("Error loading leaderboard:", error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="text-center py-8 text-red-500">
                            [ERROR] Failed to establish link with mainframes. (No data yet)
                        </td>
                    </tr>`;
            }
        }

        // Run the fetch function as soon as the page loads
        window.onload = fetchLeaderboard;
    </script>
</body>
</html>
