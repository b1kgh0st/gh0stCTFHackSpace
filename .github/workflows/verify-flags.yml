name: Verify Flag Issue & Update Leaderboard
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write # Allows the bot to comment and close the issue

concurrency:
  group: leaderboard-updates
  cancel-in-progress: false

jobs:
  verify-and-update:
    # Optional: Only run if the issue has a specific label, or just run on all issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Flag from Issue
        env:
          CTF_SECRET: ${{ secrets.CTF_SECRET }}
          # Pass the issue details safely to Python
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 verify_flags.py

      - name: Update Leaderboard
        run: python3 update_leaderboard.py

      - name: Commit Leaderboard Changes
        run: |
          git config user.name "gh0stCTF Bot"
          git config user.email "bot@gh0stctf.com"
          
          git add leaderboard/
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update leaderboard for Issue #${{ github.event.issue.number }} [bot]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes needed."
          fi
