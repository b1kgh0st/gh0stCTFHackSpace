name: Verify Flags & Update Leaderboard
on:  
  pull_request_target:    
    types: [opened, synchronize]

# Only request the permissions absolutely necessary
permissions:  
  contents: write
  pull-requests: read

# Add concurrency to prevent Git push conflicts if 2 PRs open at once
concurrency:
  group: leaderboard-updates
  cancel-in-progress: false

jobs:  
  verify:    
    runs-on: ubuntu-latest    
    steps:      
      # 1. Checkout the TRUSTED base branch (main)
      # Do NOT use the PR's sha. 
      - name: Checkout Trusted Code
        uses: actions/checkout@v4

      # 2. Run the trusted script securely. 
      # The script should use the PR number to fetch the user's submission via the API.
      - name: Verify submitted flags
        env:          
          CTF_SECRET: ${{ secrets.CTF_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 verify_flags.py      
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: python3 verify_flags.py

      - name: Update Leaderboard        
        run: python3 update_leaderboard.py      

      # 3. Safely commit and push (no detached HEAD because we checked out main normally)
      - name: Commit leaderboard changes        
        run: |          
          git config user.name "gh0stCTF Bot"          
          git config user.email "bot@gh0stctf.com"                    
          
          git add leaderboard/          
          
          # Only commit and push if there are actual changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update leaderboard for PR #${{ github.event.pull_request.number }} [bot]"
            git push origin main
          else
            echo "No changes to leaderboard."
          fi
